# Render Blueprint — deploys IP Finder as a Docker web service on the free plan.
# In Render: New > Blueprint, connect the welikechips/ip-finder repo, and Render reads this file.
# Render terminates TLS and issues the cert for the custom domain, so no Caddy is needed here.
services:
  - type: web
    name: ip-finder
    runtime: docker
    plan: free
    region: virginia          # closest Render US region to Maryland
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true          # redeploy on every push to the default branch
    envVars:
      # Primary geolocation source: MaxMind GeoLite2. Render exposes service env vars as Docker
      # build args, so this key lets the Dockerfile bake the City + ASN .mmdb into the image at
      # build time (no runtime download). sync: false = set it in the Render dashboard, never here.
      # Without it, the DB bake is skipped and getIPInfo() falls back to the HTTP providers below.
      - key: MAXMIND_LICENSE_KEY
        sync: false
      # Fallback only (used when the local GeoLite2 DBs aren't baked): authenticates ipinfo.io for
      # reliable geolocation from Render's datacenter egress. Without it, getIPInfo() falls back to
      # ipwho.is. sync: false = the value is set in the Render dashboard, never committed here.
      - key: IPINFO_TOKEN
        sync: false
      # --- Tor onion service (see deploy/ONION.md). ENABLE_ONION + ONION_ADDRESS are NON-secret and
      # committed here; the private hidden-service key is NOT — it's the sync:false ONION_KEY_B64
      # below (base64 of hs_ed25519_secret_key), set in the dashboard. ORDER MATTERS: set
      # ONION_KEY_B64 BEFORE this takes effect, or tor grinds a throwaway address, not the vanity one.
      - key: ENABLE_ONION
        value: "1"
      # Public v3 onion address (derived from the key). The clearnet site advertises it to Tor
      # Browser via the Onion-Location header.
      - key: ONION_ADDRESS
        value: jiveserzcd3zj6ptn3o3cr5l35pfibmw4vgzvkjjsvuwwuknnnptc6qd.onion
      # Base64 of the hidden-service secret key. SECRET — sync:false, set the value in the Render
      # dashboard, never commit it. (Alternatively, a Secret File named hs_ed25519_secret_key; the
      # env var wins if both are present. See deploy/ONION.md.)
      - key: ONION_KEY_B64
        sync: false