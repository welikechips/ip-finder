# Behind a reverse proxy (Caddy), recover the real client IP from X-Forwarded-For.
# Safe here because the app container is never published to the internet directly —
# only Caddy, on the private Docker network, can reach it. Apache rewrites REMOTE_ADDR
# to the real client only for requests arriving from these trusted proxy ranges.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1/8
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16